<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barde · Marseille guide musical</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Barde">
</head>
<body>
  <div id="map"></div>

  <header class="barde-header">
    <div class="brand">
      <h1>BARDE</h1>
      <span class="subtitle">Marseille · guide musical</span>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Lieu, quartier, genre..." autocomplete="off">
    </div>
  </header>

  <nav class="filters-bar">
    <button class="filter-btn active" data-filter="all">Tous</button>
    <button class="filter-btn" data-filter="concert">🎤 Concert</button>
    <button class="filter-btn" data-filter="bar_musical">🍻 Bar / Café</button>
    <button class="filter-btn" data-filter="jazz">🎷 Jazz</button>
    <button class="filter-btn" data-filter="intimate">🏠 Intimiste</button>
    <button class="filter-btn" data-filter="ephemeral">📍 Éphémère</button>
    <button class="filter-btn" data-filter="theatre_culture">🎭 Culture</button>
    <button class="filter-btn" data-filter="atypique">🎪 Atypique</button>
  </nav>

  <button id="btn-locate" class="btn-locate" title="Me géolocaliser">📍</button>

  <div id="place-panel" class="place-panel">
    <div class="sheet-handle"></div>
    <div id="panel-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/map.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => console.log(err));
      });
    }
  </script>
</body>
</html>
